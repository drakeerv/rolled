[project]
name = "ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "drakeerv", email = "drakeerv@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "orjson>=3.12.0",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
    "typesense>=2.0.0",
    "xlrd>=2.0.2",
]

[project.scripts]
ingestion = "ingestion.run_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RET", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src/ingestion"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_reexport = true
exclude = ["src/ingestion/stages"]
